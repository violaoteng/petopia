{% extends 'base.html' %}
{% load static %}

{% block title %}Log in — Petopia{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'users/css/auth.css' %}">
{% endblock %}

{% block content %}
<section class="auth-wrap">
    <div class="auth-box">
        <h1>Log in</h1>

        <form method="post" novalidate>
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            {{ form.as_p }}
            <button class="btn-submit" type="submit">Log in</button>
        </form>

        <div class="auth-links">
            <a href="{% url 'users:forgot_password' %}">Forgot password?</a>
            <a href="{% url 'users:register' %}">Create account</a>
        </div>
    </div>
</section>
{% endblock %}

{% block extra_js %}
<script src="{% static 'users/js/auth.js' %}"></script>
{% endblock %}
